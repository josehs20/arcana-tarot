# =============================================================================
# Proxy reverso compartilhado (container shared-proxy) — nginx 1.27
# =============================================================================
# Substitui o /etc/nginx/nginx.conf da imagem para não depender do layout de
# includes da distribuição. Tudo aqui roda dentro de 48 MB: 1 worker, sem
# cache de proxy em disco e com buffers pequenos.
#
# O roteamento por domínio fica em conf.d/: um arquivo por instância.
# =============================================================================

user  nginx;
worker_processes 1;

error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;

    log_format main '$remote_addr - $host [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main;

    # --- Rede / timeouts ----------------------------------------------------
    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     30s;
    keepalive_requests    200;
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    reset_timedout_connection on;
    # Fotos de perfil e áudios passam por aqui (limite do PHP é 30M).
    client_max_body_size  40m;
    client_body_buffer_size 128k;

    # --- Compressão (aplicada nas respostas vindas do container web) --------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/rss+xml
                      image/svg+xml font/woff2;

    # --- DNS interno do Docker ---------------------------------------------
    # Necessário porque os upstreams são variáveis (`set $upstream ...`), o que
    # permite subir o proxy antes das aplicações (502 até elas responderem) e
    # reassumir o IP correto quando um container é recriado.
    resolver          127.0.0.11 valid=10s ipv6=off;
    resolver_timeout  5s;

    # Upgrade para WebSocket (Reverb).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
