# =============================================================================
# Servidor padrão — responde a acessos por IP ou por domínio não configurado.
# =============================================================================
# /healthz é usado pelo healthcheck do container `shared-proxy`.
# Qualquer outro Host recebe 444 (nginx fecha a conexão sem responder), o que
# evita que scanners descubram que existe um servidor web no IP do VPS.
# =============================================================================

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    # Handshake recusado sem certificado: cobre acessos ao IP e SNI desconhecido.
    ssl_reject_handshake on;

    location / {
        return 444;
    }
}
