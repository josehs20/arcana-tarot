# =============================================================================
# voz-arcana — roteamento do domínio para a instância `voz-arcana`
# =============================================================================
# 1) Troque TODAS as ocorrências de `vozarcana.seudominio.com` pelo domínio real:
#      sed -i 's/vozarcana\.seudominio\.com/vozarcana.seudominio.com.br/g' \
#          deploy/nginx/conf.d/voz-arcana.conf
# 2) Os certificados precisam existir ANTES de subir o proxy:
#      deploy/nginx/letsencrypt/live/<dominio>/{fullchain.pem,privkey.pem}
#    (ver deploy/DEPLOY.md, seção "TLS")
# 3) Upstreams resolvidos por DNS do Docker a cada 10s:
#      voz-arcana-web     -> nginx+php-fpm da instância (compose: docker-compose.prod.yml)
#      voz-arcana-reverb  -> WebSocket do Laravel Reverb
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name vozarcana.seudominio.com;

    # Renovação do certbot (webroot). Precisa vir antes do redirect.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type "text/plain";
        try_files    $uri =404;
        access_log   off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name vozarcana.seudominio.com;

    ssl_certificate     /etc/letsencrypt/live/vozarcana.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozarcana.seudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS_vozarcana:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling        off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    set $voz_arcana_app "voz-arcana-web:80";
    set $voz_arcana_ws  "voz-arcana-reverb:8080";

    # --- Laravel Reverb (protocolo Pusher): WebSocket em /app/<key> ----------
    location /app {
        proxy_pass         http://$voz_arcana_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        # Sem buffer: a conexão fica aberta por horas.
        proxy_buffering    off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        access_log off;
    }

    # --- Aplicação (nginx interno + PHP-FPM no container web) ----------------
    location / {
        proxy_pass         http://$voz_arcana_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_redirect        off;
    }
}
