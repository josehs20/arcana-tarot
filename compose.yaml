name: arcana-tarot

# Definição comum da imagem da aplicação (PHP-FPM + extensões + Composer).
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: arcana-tarot/app:local
  working_dir: /var/www/html
  env_file:
    - .env
  volumes:
    - .:/var/www/html
  networks:
    - arcana
  restart: unless-stopped

services:
  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - arcana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Sem mapeamento de porta: o MySQL fica acessível apenas na rede interna.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-arcana_tarot}
      MYSQL_USER: ${DB_USERNAME:-arcana}
      MYSQL_PASSWORD: ${DB_PASSWORD:-arcana_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-arcana_root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - arcana
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sem mapeamento de porta: o Redis fica acessível apenas na rede interna.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - arcana
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  queue:
    <<: *app
    user: "1000:1000"
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Ativado no Prompt 12 (após instalar laravel/reverb):
  #   docker compose --profile reverb up -d
  reverb:
    <<: *app
    user: "1000:1000"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    profiles: ["reverb"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy

  # Opcional em desenvolvimento (UI em http://localhost:8025):
  #   docker compose --profile mailpit up -d
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    profiles: ["mailpit"]
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - arcana

volumes:
  mysql_data:
  redis_data:

networks:
  arcana:
    driver: bridge
