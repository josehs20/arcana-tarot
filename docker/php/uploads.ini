; O teto da aplicação é 25 MB por imagem (IMAGE_UPLOAD_MAX_KB=25600). O PHP
; precisa aceitar o multipart completo com folga para campos de texto e
; possíveis arquivos enviados fora da otimização do navegador.
;
; Nginx usa `client_max_body_size 40M` para não cortar antes do PHP, e a
; aplicação normaliza (orientação, redução e recompressão) antes de gravar.
upload_max_filesize = 32M
post_max_size = 40M
