; =============================================================================
; php.ini de produção (imagem docker/php/Dockerfile.prod)
; =============================================================================
; Não é usado em desenvolvimento: o compose.yaml local continua com os padrões
; da imagem oficial. Aqui o objetivo é caber em 220 MB (container `web`).
; =============================================================================

; --- Memória e erros ---------------------------------------------------------
; Teto por processo. O upload de imagens sobe este valor em tempo de execução
; via IMAGE_MEMORY_LIMIT (config/images.php + ImageNormalizer::raiseMemoryLimit).
; O valor de IMAGE_MEMORY_LIMIT precisa ser MENOR que o `mem_limit` do
; container, senão o kernel mata o processo antes do PHP reclamar.
memory_limit = 128M

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; stderr do container -> `docker compose logs`
error_log = /proc/self/fd/2

max_execution_time = 120
max_input_time = 60
default_socket_timeout = 30

; --- OPcache ----------------------------------------------------------------
; O código vem dentro da imagem: não há motivo para checar timestamps a cada
; requisição. Qualquer alteração de código exige `docker compose build` — que é
; exatamente o fluxo de deploy descrito em deploy/DEPLOY.md.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 48
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
; JIT não traz ganho para carga dominada por Blade/Eloquent e reserva memória
; fixa; fica desligado de propósito.
opcache.jit = off
opcache.jit_buffer_size = 0

; --- Realpath cache ---------------------------------------------------------
; Laravel resolve centenas de caminhos por requisição; 600s de cache evita
; varreduras de diretório repetidas.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
