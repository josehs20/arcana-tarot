; =============================================================================
; Supervisor do container `web` de produção
; =============================================================================
; Um único container (limite de 220 MB) roda três processos:
;
;   php-fpm        master do pool `ondemand` (docker/php/www.conf)
;   nginx          serve /var/www/html/public e repassa .php para 127.0.0.1:9000
;   scheduler      `php artisan schedule:work` — sem ele nenhuma rotina
;                  `everyMinute` roda (cobrança por minuto, expiração de
;                  solicitações, interrupção por inatividade e fechamento de
;                  chamadas órfãs).
;
; Por que o agendador aqui e não em um quarto container: um container extra
; custaria mais ~100 MB de limite (o `schedule:work` abre um `schedule:run` e
; este, por sua vez, os comandos agendados). No orçamento de 2 GB para dois
; sites isso não cabe. Como efeito colateral, o pico do agendador disputa os
; 220 MB com os filhos do PHP-FPM; por isso o pool é pequeno.
;
; Para desligar o agendador sem editar arquivos:
;   docker compose exec web supervisorctl stop scheduler
; (volta a subir no próximo restart do container). Alternativa definitiva:
; comentar o bloco [program:scheduler] e usar cron do host com
; `php artisan schedule:run` (ver deploy/DEPLOY.md).
; =============================================================================

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
loglevel = warn

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[program:php-fpm]
command = /usr/local/sbin/php-fpm -F
priority = 10
autostart = true
autorestart = true
startsecs = 2
stopsignal = QUIT
stopwaitsecs = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startsecs = 2
stopsignal = QUIT
stopwaitsecs = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = php artisan schedule:work
directory = /var/www/html
user = appuser
priority = 30
autostart = true
autorestart = true
startsecs = 5
; SIGTERM no grupo inteiro: o `schedule:work` espera o `schedule:run` em curso
; terminar antes de sair (não corta uma cobrança no meio).
stopsignal = TERM
stopasgroup = true
killasgroup = true
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
