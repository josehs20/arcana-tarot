[www]
user = appuser
group = appuser

listen = 9000

; -----------------------------------------------------------------------------
; Pool dimensionado para um VPS de 2 GB rodando DOIS sites no mesmo servidor.
;
; `ondemand` só cria filho quando chega requisição e o encerra após
; `process_idle_timeout`: com tráfego intermitente (o caso destas duas
; aplicações) um pool `dynamic` manteria 2-4 processos parados consumindo
; ~35 MB cada. Com `ondemand` o custo em repouso é só o master (~12 MB).
;
; 5 filhos é o teto que cabe no limite de 220 MB do container `web`
; (5 x ~35 MB + nginx + supervisor + agendador). `max_requests` recicla o
; processo de tempos em tempos para não acumular memória de bibliotecas.
;
; Para mais concorrência, suba `pm.max_children` junto com o `mem_limit` do
; serviço `web` em docker-compose.prod.yml — nunca só um dos dois.
; -----------------------------------------------------------------------------
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Requisição presa não pode ocupar um dos 5 filhos para sempre. O maior tempo
; legítimo é a normalização de uma imagem grande (alguns segundos).
request_terminate_timeout = 120s

; `docker compose exec web wget -q -O - http://127.0.0.1/fpm-status` acompanha
; o pool sem instalar nada (o Nginx interno publica isso apenas em 127.0.0.1).
pm.status_path = /fpm-status

catch_workers_output = yes
decorate_workers_output = no
