# =============================================================================
# Nginx INTERNO do container `web` (não é exposto na internet)
# =============================================================================
# O tráfego chega sempre pelo proxy compartilhado (deploy/nginx/), então:
#   - o TLS já terminou: o proxy informa X-Forwarded-Proto=https;
#   - `real_ip` recupera o IP real do visitante (rate limit por IP correto);
#   - `fastcgi_param HTTPS` reflete o esquema externo, então o Laravel gera
#     URLs https:// e emite cookies `secure` sem depender de TRUSTED_PROXIES.
#
# Este arquivo substitui o /etc/nginx/nginx.conf inteiro de propósito: assim não
# dependemos do layout de includes da distribuição Alpine.
# =============================================================================

user  nginx;
worker_processes 1;

error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset       utf-8;

    log_format main '$remote_addr - $host [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30s;

    # Igual ao post_max_size do PHP (docker/php/uploads.ini).
    client_max_body_size 40M;

    # Buffers de FastCGI enxutos (cada worker do nginx também é memória).
    fastcgi_buffers      16 16k;
    fastcgi_buffer_size  32k;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;

    # Temporários em /tmp (mesmo sistema de arquivos, sem volume extra).
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # IP real do visitante informado pelo proxy compartilhado (redes Docker).
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # O certificado está no proxy: "on" quando ele diz que a origem foi https.
    map $http_x_forwarded_proto $app_https {
        default '';
        https   'on';
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        # Cabeçalhos de segurança também aqui: o proxy só repassa o que a
        # resposta trouxer (ele não injeta nada além do HSTS).
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(self), microphone=(self), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Assets versionados pelo Vite (nome com hash) podem ser cacheados.
        location /build/ {
            access_log off;
            expires    1y;
            add_header Cache-Control "public, immutable" always;
            try_files  $uri =404;
        }

        # Uploads servidos pelo symlink public/storage -> storage/app/public.
        location /storage/ {
            access_log off;
            expires    30d;
            try_files  $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Healthcheck do Laravel (usado pelo compose e pelo balanceador).
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Status do pool PHP-FPM: só acessível de dentro do container.
        # Sem `include fastcgi_params` de propósito: o `SCRIPT_NAME` duplicado
        # (um vindo do include, outro daqui) faz o PHP-FPM procurar o script em
        # disco e responder 404 em vez da página de status.
        location = /fpm-status {
            access_log off;
            allow      127.0.0.1;
            deny       all;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_NAME    /fpm-status;
            fastcgi_param SCRIPT_FILENAME /fpm-status;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param QUERY_STRING   $query_string;
            fastcgi_param SERVER_NAME    $host;
            fastcgi_param REMOTE_ADDR    $remote_addr;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO         $fastcgi_path_info;
            fastcgi_param HTTPS             $app_https;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host;
            fastcgi_param HTTP_X_REAL_IP         $remote_addr;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
